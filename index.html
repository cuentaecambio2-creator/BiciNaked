<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PedalShop - Configura tu Bici Ideal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-bicycle"></i>
                <span>PedalShop</span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Inicio</a></li>
                <li><a href="#configurador">Configurador</a></li>
                <li><a href="#productos">Tienda</a></li>
                <li><a href="#tiendas">Tiendas</a></li>
            </ul>
            <div class="carrito">
                <i class="fas fa-shopping-cart" id="cart-icon"></i>
                <span id="cart-count">0</span>
            </div>
        </nav>
    </header>

    <!-- HERO -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Tu <span class="highlight">Bici Perfecta</span> te espera</h1>
            <p>Configura cada detalle. Monta tu sueño.</p>
            <a href="#configurador" class="cta-btn">Configurar Ahora <i class="fas fa-arrow-right"></i></a>
        </div>
    </section>

    <!-- CONFIGURADOR 3D -->
    <section id="configurador" class="configurador">
        <div class="container">
            <h2><i class="fas fa-wrench"></i> Configurador 3D</h2>
            <div class="configurador-grid">
                <!-- Vista 3D -->
                <div class="bike-view">
                    <canvas id="bikeCanvas" width="500" height="500"></canvas>
                    <div class="price-tag">
                        <span id="precioConfig">desde $1.899</span>
                    </div>
                </div>

                <!-- Opciones -->
                <div class="opciones">
                    <div class="opcion" data-tipo="cuadro">
                        <h3><i class="fas fa-cube"></i> Cuadro</h3>
                        <div class="opciones-lista">
                            <button class="opcion-btn active" data-valor="carbon-negro">
                                <span>Carbono Negro</span> <small>$0</small>
                            </button>
                            <button class="opcion-btn" data-valor="carbon-blanco">
                                <span>Carbono Blanco</span> <small>$200</small>
                            </button>
                            <button class="opcion-btn" data-valor="carbon-rojo">
                                <span>Carbono Rojo</span> <small>$150</small>
                            </button>
                        </div>
                    </div>

                    <div class="opcion" data-tipo="ruedas">
                        <h3><i class="fas fa-circle"></i> Ruedas</h3>
                        <div class="opciones-lista">
                            <button class="opcion-btn active" data-valor="29-aluminio">
                                <span>29" Aluminio</span> <small>$0</small>
                            </button>
                            <button class="opcion-btn" data-valor="275-carbono">
                                <span>27.5" Carbono</span> <small>$350</small>
                            </button>
                        </div>
                    </div>

                    <div class="opcion" data-tipo="grupo">
                        <h3><i class="fas fa-cogs"></i> Grupo</h3>
                        <div class="opciones-lista">
                            <button class="opcion-btn active" data-valor="deore">
                                <span>Shimano Deore</span> <small>$0</small>
                            </button>
                            <button class="opcion-btn" data-valor="xt">
                                <span>Shimano XT</span> <small>$450</small>
                            </button>
                            <button class="opcion-btn" data-valor="sram">
                                <span>SRAM GX</span> <small>$380</small>
                            </button>
                        </div>
                    </div>

                    <button class="btn-comprar-config" id="comprarConfig">
                        <i class="fas fa-shopping-cart"></i> Agregar al Carrito - $<span id="precioFinalConfig">1899</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- PRODUCTOS -->
    <section id="productos" class="productos">
        <div class="container">
            <h2><i class="fas fa-store"></i> Nuestras Bicis</h2>
            <div class="filtros">
                <button class="filtro-btn active" data-categoria="all">Todas</button>
                <button class="filtro-btn" data-categoria="mountain">MTB</button>
                <button class="filtro-btn" data-categoria="ruta">Ruta</button>
                <button class="filtro-btn" data-categoria="gravel">Gravel</button>
                <button class="filtro-btn" data-categoria="electrica">E-Bike</button>
            </div>
            <div id="productos-grid" class="productos-grid"></div>
        </div>
    </section>

    <!-- CARRITO -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart">
            <div class="cart-header">
                <h3>🛒 Tu Carrito</h3>
                <span class="close-cart" id="closeCart">&times;</span>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                <h3>Total: $<span id="cartTotal">0</span></h3>
                <button class="btn-checkout">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <p>&copy; 2024 PedalShop. Todas las bicis, todo el flow.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
